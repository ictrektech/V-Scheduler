services:
  controller-amd:
    <<: *controller
    profiles: [amd]
    runtime: nvidia
    image: ${V_SCHEDULER_AMD_IMAGE}
  controller-arm:
    <<: *controller
    profiles: [arm, l4t, thor-spark]
    runtime: nvidia
    image: ${V_SCHEDULER_ARM_IMAGE}
  controller-amd-cpu:
    <<: *controller
    profiles: [amd-without-cuda]
    image: ${V_SCHEDULER_AMD_IMAGE}
  controller-arm-cpu:
    <<: *controller
    profiles: [arm-without-cuda]
    image: ${V_SCHEDULER_ARM_IMAGE}
  gateway-amd:
    <<: *gateway
    profiles: [amd, amd-without-cuda]
    image: ${V_ROUTER_BACKEND_AMD_IMAGE}
  gateway-arm:
    <<: *gateway
    profiles: [arm, arm-without-cuda, l4t, thor-spark]
    image: ${V_ROUTER_BACKEND_ARM_IMAGE}
  model-storage-amd:
    <<: *model-storage
    profiles: [amd]
    image: ${V_SCHEDULER_AMD_IMAGE}
    environment:
      <<: *model-storage-env
      MODEL_HUB_PROFILE: amd
      V_SCHEDULER_IMAGE: ${V_SCHEDULER_AMD_IMAGE}
      V_ROUTER_BACKEND_IMAGE: ${V_ROUTER_BACKEND_AMD_IMAGE}
      OLLAMA_SERVER_IMAGE: ${OLLAMA_SERVER_AMD_IMAGE}
  model-storage-amd-without-cuda:
    <<: *model-storage
    profiles: [amd-without-cuda]
    image: ${V_SCHEDULER_AMD_IMAGE}
    environment:
      <<: *model-storage-env
      MODEL_HUB_PROFILE: amd-without-cuda
      V_SCHEDULER_IMAGE: ${V_SCHEDULER_AMD_IMAGE}
      V_ROUTER_BACKEND_IMAGE: ${V_ROUTER_BACKEND_AMD_IMAGE}
      OLLAMA_SERVER_IMAGE: ${OLLAMA_SERVER_AMD_IMAGE}
  model-storage-arm:
    <<: *model-storage
    profiles: [arm]
    image: ${V_SCHEDULER_ARM_IMAGE}
    environment:
      <<: *model-storage-env
      MODEL_HUB_PROFILE: arm
      V_SCHEDULER_IMAGE: ${V_SCHEDULER_ARM_IMAGE}
      V_ROUTER_BACKEND_IMAGE: ${V_ROUTER_BACKEND_ARM_IMAGE}
      OLLAMA_SERVER_IMAGE: ${OLLAMA_SERVER_ARM_IMAGE}
  model-storage-arm-without-cuda:
    <<: *model-storage
    profiles: [arm-without-cuda]
    image: ${V_SCHEDULER_ARM_IMAGE}
    environment:
      <<: *model-storage-env
      MODEL_HUB_PROFILE: arm-without-cuda
      V_SCHEDULER_IMAGE: ${V_SCHEDULER_ARM_IMAGE}
      V_ROUTER_BACKEND_IMAGE: ${V_ROUTER_BACKEND_ARM_IMAGE}
      OLLAMA_SERVER_IMAGE: ${OLLAMA_SERVER_ARM_WITHOUT_CUDA_IMAGE}
  model-storage-l4t:
    <<: *model-storage
    profiles: [l4t]
    image: ${V_SCHEDULER_ARM_IMAGE}
    environment:
      <<: *model-storage-env
      MODEL_HUB_PROFILE: l4t
      V_SCHEDULER_IMAGE: ${V_SCHEDULER_ARM_IMAGE}
      V_ROUTER_BACKEND_IMAGE: ${V_ROUTER_BACKEND_ARM_IMAGE}
      OLLAMA_SERVER_IMAGE: ${OLLAMA_SERVER_L4T_IMAGE}
  model-storage-thor-spark:
    <<: *model-storage
    profiles: [thor-spark]
