id: com.ictrek.v-scheduler
name:
  zh-CN: V-Scheduler 模型与算力
  en: V-Scheduler
  zh-TW: V-Scheduler 模型與算力
description:
  zh-CN: 模型路由、协议适配、用量统计、任务排队与资源调度。
  en: Model routing, protocol adapters, usage, task queues and resource scheduling.
  zh-TW: 模型路由、協定適配、用量統計、任務佇列與資源調度。
version: __APP_VERSION__
author: ictrek
category: [system]
icon: icon.png
arch: [amd64, arm64]
frontend:
  enabled: true
  basePath: /app/com.ictrek.v-scheduler
# Reuse the VOS login bridge, as declared by V-Router.
oauth2:
  client: {}
platform:
  version: '>=3.0.0'
dependencies:
  apps:
    - id: com.ictrek.pgv
      version: latest
      optional: false
profiles:
  - name: amd-cuda
    title: {zh-CN: "AMD64 NVIDIA", en: "AMD64 NVIDIA", zh-TW: "AMD64 NVIDIA"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: amd64
      software: [cuda]
    conflicts: [amd-cpu, arm-cuda, arm-cpu, jetson-orin, jetson-thor, dgx-spark]
  - name: amd-cpu
    title: {zh-CN: "AMD64 CPU", en: "AMD64 CPU", zh-TW: "AMD64 CPU"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: amd64
    conflicts: [amd-cuda, arm-cuda, arm-cpu, jetson-orin, jetson-thor, dgx-spark]
  - name: arm-cuda
    title: {zh-CN: "ARM64 NVIDIA", en: "ARM64 NVIDIA", zh-TW: "ARM64 NVIDIA"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
      software: [cuda]
    conflicts: [amd-cuda, amd-cpu, arm-cpu, jetson-orin, jetson-thor, dgx-spark]
  - name: arm-cpu
    title: {zh-CN: "ARM64 CPU", en: "ARM64 CPU", zh-TW: "ARM64 CPU"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
    conflicts: [amd-cuda, amd-cpu, arm-cuda, jetson-orin, jetson-thor, dgx-spark]
  - name: jetson-orin
    title: {zh-CN: "Jetson Orin", en: "Jetson Orin", zh-TW: "Jetson Orin"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
      software: [cuda]
      device-type:
        - any-of: [jetson-orin, l4t, jetson]
    conflicts: [amd-cuda, amd-cpu, arm-cuda, arm-cpu, jetson-thor, dgx-spark]
  - name: jetson-thor
    title: {zh-CN: "Jetson Thor", en: "Jetson Thor", zh-TW: "Jetson Thor"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
      software: [cuda]
      device-type:
        - any-of: [jetson-thor, thor, thor-spark]
    conflicts: [amd-cuda, amd-cpu, arm-cuda, arm-cpu, jetson-orin, dgx-spark]
  - name: dgx-spark
    title: {zh-CN: "DGX Spark", en: "DGX Spark", zh-TW: "DGX Spark"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
      software: [cuda]
      device-type:
        - any-of: [dgx-spark, spark]
    conflicts: [amd-cuda, amd-cpu, arm-cuda, arm-cpu, jetson-orin, jetson-thor]
require-profiles: true
projects:
  - name: scheduler-app-backend
    title: {zh-CN: 应用远程后端, en: Remote application backend}
  - name: etcd
    title: {zh-CN: 集群状态存储, en: Cluster State Store}
  - name: postgres-ha
    title: {zh-CN: 高可用 PostgreSQL, en: High-availability PostgreSQL}
  - name: haproxy
    title: {zh-CN: 集群负载均衡, en: Cluster Load Balancer}
  - name: temporal
    title: {zh-CN: 集群工作流, en: Cluster Workflows}
  - name: keepalived
    title: {zh-CN: 集群虚拟 IP, en: Cluster Virtual IP}
storage:
  directories:
    - path: config
      mode: '0700'

    - path: gateway
      mode: '0700'

    - path: inference
      mode: '0700'

    - path: cluster
      mode: '0700'
