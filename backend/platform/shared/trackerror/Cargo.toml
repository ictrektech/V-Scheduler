[package]
name = "trackerror"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Track your error"
homepage = "https://gitee.com/wsgalaxy/trackerror"
repository = "https://gitee.com/wsgalaxy/trackerror"
readme = "README.md"

[dependencies]
libc = { version = "0.2", features = ["extra_traits"] }
strum = { version = "0.27", features = ["derive"] }
num_enum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
