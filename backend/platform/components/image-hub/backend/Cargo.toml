[package]
name = "image-hub"
version = "0.1.0"
edition = "2024"
description = "image-hub 组件：VOS 离线镜像中转（官方 registry + 管理后端/前端，镜像查询/删除与命令生成）"
license = "Apache-2.0"

# 二进制入口：image-hub --port ... --frontend-dir ... --registry-url ...
# lib + bin 分离：lib 导出核心逻辑便于单元测试，bin 仅做入口装配
[[bin]]
name = "image-hub"
path = "src/bin/image_hub.rs"

[lib]
name = "image_hub"
path = "src/lib.rs"

[dependencies]
# === 异步运行时 ===
tokio = { version = "1.40", features = ["full"] }

# === HTTP 框架 ===
axum = { version = "0.8", features = ["macros", "json", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

# === CLI 参数解析 ===
clap = { version = "4.5", features = ["derive", "env"] }

# === 结构化日志 ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# === 序列化 ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === 时间（health 时间戳 / manifest created 透传）===
chrono = { version = "0.4", features = ["serde"] }

# === registry API / 平台 API 调用（rustls 避免系统 openssl）===
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# === 异步 trait（RegistryClient / PlatformClient 抽象）===
async-trait = "0.1"

# === 错误处理 ===
thiserror = "2"
anyhow = "1"

# === 共享错误库（category 实现，对齐 vos-http-response-spec）===
trackerror = { path = "../../../shared/trackerror" }

# === 归档解析（导入 OCI 归档时读取 index.json；gzip / xz 透明解压）===
tar = "0.4"
flate2 = "1"
xz2 = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"