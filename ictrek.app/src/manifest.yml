id: com.ictrek.v-scheduler
name:
  zh-CN: V-Scheduler 资源调度
  en: V-Scheduler
  zh-TW: V-Scheduler 資源調度
description:
  zh-CN: 任务排队、资源预约、受控重试与节点资源观察。
  en: Task queues, reservations, controlled retries and node resource monitoring.
  zh-TW: 任務排隊、資源預約、受控重試與節點資源觀察。
version: __APP_VERSION__
author: ictrek
category: [system]
icon: icon.png
arch: [amd64, arm64]
frontend:
  enabled: true
  basePath: /app/com.ictrek.v-scheduler
# Reuse the VOS login bridge, as declared by V-Router.
oauth2:
  client: {}
platform:
  version: '>=3.0.0'
dependencies:
  apps:
    - id: com.ictrek.pgv
      version: '>=0.0.21'
      optional: false
profiles:
  - name: amd
    title: {zh-CN: "AMD64 NVIDIA", en: "AMD64 NVIDIA", zh-TW: "AMD64 NVIDIA"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: amd64
      software: [cuda]
    conflicts: [amd-without-cuda, arm, arm-without-cuda, l4t, thor-spark]
  - name: amd-without-cuda
    title: {zh-CN: "AMD64 CPU", en: "AMD64 CPU", zh-TW: "AMD64 CPU"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: amd64
    conflicts: [amd, arm, arm-without-cuda, l4t, thor-spark]
  - name: arm
    title: {zh-CN: "ARM64 NVIDIA", en: "ARM64 NVIDIA", zh-TW: "ARM64 NVIDIA"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
      software: [cuda]
    conflicts: [amd, amd-without-cuda, arm-without-cuda, l4t, thor-spark]
  - name: arm-without-cuda
    title: {zh-CN: "ARM64 CPU", en: "ARM64 CPU", zh-TW: "ARM64 CPU"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
    conflicts: [amd, amd-without-cuda, arm, l4t, thor-spark]
  - name: l4t
    title: {zh-CN: "Jetson / L4T", en: "Jetson / L4T", zh-TW: "Jetson / L4T"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
      software: [cuda]
      device-type:
        - any-of: [l4t, jetson]
    conflicts: [amd, amd-without-cuda, arm, arm-without-cuda, thor-spark]
  - name: thor-spark
    title: {zh-CN: "Jetson Thor / Spark", en: "Jetson Thor / Spark", zh-TW: "Jetson Thor / Spark"}
    description: {zh-CN: "内置本机资源采集，安装后自动启动", en: "Built-in host resource collection starts automatically", zh-TW: "內建本機資源取樣，安裝後自動啟動"}
    caps:
      arch: arm64
      software: [cuda]
      device-type:
        - any-of: [thor-spark, thor]
    conflicts: [amd, amd-without-cuda, arm, arm-without-cuda, l4t]
require-profiles: true
storage:
  directories:
    - path: config
      mode: '0700'
